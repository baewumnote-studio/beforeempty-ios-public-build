name: BeforeEmpty manual iOS Release
on:
  workflow_dispatch:
    inputs:
      upload_app:
        description: Compile, sign and upload the verified app to App Store Connect
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: beforeempty-public-store
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'baewumnote-studio/beforeempty-ios-public-build' && github.repository_owner_id == '337203413' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    environment: beforeempty-store
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned hashed dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.txt
      - name: Verify confidentiality guards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate source, signing and app before Mac time
        env:
          BUILD_INPUT_KEY: ${{ secrets.BUILD_INPUT_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          PRIVATE_BACKUP_TOKEN: ${{ secrets.PRIVATE_BACKUP_TOKEN }}
          UPLOAD_APP: ${{ inputs.upload_app }}
          REPOSITORY_IS_PUBLIC: ${{ !github.event.repository.private }}
        run: python scripts/run_build.py preflight
  ios:
    needs: preflight
    if: github.repository == 'baewumnote-studio/beforeempty-ios-public-build' && github.repository_owner_id == '337203413' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: macos-26
    environment: beforeempty-store
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned hashed dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-ci.txt
      - name: Compile; optionally sign, retain privately and upload to Apple
        env:
          BUILD_INPUT_KEY: ${{ secrets.BUILD_INPUT_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          PRIVATE_BACKUP_TOKEN: ${{ secrets.PRIVATE_BACKUP_TOKEN }}
          UPLOAD_APP: ${{ inputs.upload_app }}
          REPOSITORY_IS_PUBLIC: ${{ !github.event.repository.private }}
        run: python scripts/run_build.py ios
